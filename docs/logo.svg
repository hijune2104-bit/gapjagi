<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 96" width="210" height="96" aria-label="갑자기" role="img">
  <!-- 마크(박스+안쪽선+갑)를 통째로 살짝 반시계 회전 -->
  <g transform="rotate(-9 44 50)">
    <!-- 코랄 squircle -->
    <rect x="6" y="12" width="76" height="76" rx="24" fill="#FF5A32" />
    <!-- 안쪽 라운드 스트로크 -->
    <rect x="15" y="21" width="58" height="58" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3.5" />
    <!-- "갑" -->
    <text x="44" y="52" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, sans-serif" font-weight="800" font-size="44" fill="#1A1A1E">갑</text>
  </g>
  <!-- 반짝이 (코랄 큰 것 + 노랑 작은 것) -->
  <path d="M86 13 Q86 24 97 24 Q86 24 86 35 Q86 24 75 24 Q86 24 86 13 Z" fill="#FF5A32" />
  <path d="M99 3 Q99 9 105 9 Q99 9 99 15 Q99 9 93 9 Q99 9 99 3 Z" fill="#FDB022" />
  <!-- "자기" -->
  <text x="96" y="52" text-anchor="start" dominant-baseline="central" font-family="Pretendard, sans-serif" font-weight="800" font-size="58" letter-spacing="-2" fill="#1A1A1E">자기</text>
</svg>
